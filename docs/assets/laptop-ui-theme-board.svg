    <text x="0" y="291" class="label">Aurora</text><text x="0" y="319" class="note">color-washed glass</text>
  </g>
  <g transform="translate(838 178)">
    <rect width="182" height="300" rx="22" fill="#efeee9" stroke="#dddcd5"/>
    <rect x="15" y="21" width="152" height="245" rx="17" fill="#ffffff" stroke="#e3e2dd"/>
    <rect x="15" y="21" width="152" height="49" rx="17" fill="#f6f5f1" stroke="#e4e2dc"/>
    <circle cx="37" cy="45" r="8" fill="#c7d2c5"/><rect x="52" y="40" width="76" height="9" rx="4" fill="#74796c"/>
    <rect x="29" y="91" width="123" height="10" rx="5" fill="#dcded8"/><rect x="29" y="114" width="104" height="10" rx="5" fill="#e9eae5"/><rect x="29" y="149" width="123" height="60" rx="11" fill="#f5f5f1"/>
    <text x="0" y="291" class="label">Mac Core</text><text x="0" y="319" class="note">quiet native surfaces</text>
  </g>
  <g transform="translate(1034 178)">
    <rect width="182" height="300" rx="0" fill="#c6c6b9" stroke="#77776c" stroke-width="3"/>
    <rect x="8" y="10" width="166" height="34" fill="#000080"/>
