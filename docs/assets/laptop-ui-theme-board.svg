  </g>
  <g transform="translate(1230 178)">
    <rect width="182" height="300" rx="0" fill="#f5e3eb" stroke="#d7b8c5" stroke-width="2"/>
    <rect x="0" y="0" width="182" height="39" fill="#e59fc0"/>
    <text x="15" y="25" fill="#593b4a" font-family="Arial,sans-serif" font-size="13" font-weight="700">Widget title</text>
    <rect x="12" y="53" width="158" height="234" fill="#fff9fb" stroke="#e5cbd6" stroke-width="2"/>
    <rect x="24" y="72" width="134" height="12" fill="#f0d8e2"/><rect x="24" y="98" width="115" height="12" fill="#f4e4ea"/>
    <rect x="24" y="132" width="134" height="66" fill="#f8eaf0" stroke="#e5cbd6"/>
