<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="590" viewBox="0 0 1440 590" role="img" aria-labelledby="title desc">
  <title id="title">Glassday theme surface previews</title>
  <desc id="desc">Seven theme samples share one widget frame geometry while changing background material, palette, border and shadow.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f5ff"/><stop offset="1" stop-color="#edf2fa"/></linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c6ce3"/><stop offset=".5" stop-color="#76b7db"/><stop offset="1" stop-color="#efb0d2"/></linearGradient>
    <linearGradient id="darkGlass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#293449"/><stop offset="1" stop-color="#101522"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <style>.title{font-family:Inter,Arial,sans-serif;fill:#22233a;font-size:27px;font-weight:700}.label{font-family:Inter,Arial,sans-serif;fill:#303149;font-size:15px;font-weight:650}.note{font-family:Inter,Arial,sans-serif;fill:#777890;font-size:13px}.mini{font-family:Inter,Arial,sans-serif;font-size:11px;letter-spacing:.08em}</style>
  </defs>
  <rect width="1440" height="590" rx="26" fill="#f6f6fb"/>
  <text x="54" y="62" class="mini" fill="#898aa0">GLASSDAY  /  THEME SURFACES</text>
  <text x="54" y="104" class="title">One geometry. Seven visual materials.</text>
  <text x="54" y="132" class="note">The title row and body inset stay aligned when the theme changes.</text>
  <g transform="translate(54 178)">
    <rect width="182" height="300" rx="22" fill="#ece8fa" stroke="#ddd8ef"/>
    <rect x="15" y="21" width="152" height="245" rx="17" fill="#fff9" stroke="#fff"/>
    <rect x="15" y="21" width="152" height="49" rx="17" fill="#f4efff" stroke="#e7e0f8"/>
    <circle cx="37" cy="45" r="8" fill="#cdbdf5"/><rect x="52" y="40" width="76" height="9" rx="4" fill="#c2bfd2"/>
    <rect x="29" y="91" width="123" height="10" rx="5" fill="#e6e3ee"/><rect x="29" y="114" width="104" height="10" rx="5" fill="#eceaf2"/><rect x="29" y="149" width="123" height="60" rx="11" fill="#f5f2fb"/>
    <text x="0" y="291" class="label">Pastel</text><text x="0" y="319" class="note">soft tinted glass</text>
  </g>
  <g transform="translate(250 178)">
    <rect width="182" height="300" rx="22" fill="url(#paper)" stroke="#e1e4ee"/>
    <circle cx="129" cy="54" r="48" fill="#bfe4ee" opacity=".65" filter="url(#blur)"/>
    <rect x="15" y="21" width="152" height="245" rx="17" fill="#ffffffa6" stroke="#ffffff"/>
    <rect x="15" y="21" width="152" height="49" rx="17" fill="#ffffff67" stroke="#ffffff"/>
    <circle cx="37" cy="45" r="8" fill="#b6daeb"/><rect x="52" y="40" width="76" height="9" rx="4" fill="#9eabb8"/>
