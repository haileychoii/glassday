    <text x="0" y="291" class="label">Glass Light</text><text x="0" y="319" class="note">bright frosted glass</text>
  </g>
  <g transform="translate(446 178)">
    <rect width="182" height="300" rx="22" fill="url(#darkGlass)" stroke="#30394e"/>
    <circle cx="48" cy="70" r="50" fill="#567cbd" opacity=".55" filter="url(#blur)"/>
