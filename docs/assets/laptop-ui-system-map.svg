<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-labelledby="title desc">
  <title id="title">Glassday Laptop UI system map</title>
  <desc id="desc">Diagram connecting application shell, dashboard grid, shared widget frame, design tokens, widget content and theme surfaces.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f5ff"/><stop offset="1" stop-color="#edf6ff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8b8bb4"/></marker>
    <style>.h{font-family:Inter,Arial,sans-serif;fill:#25253c;font-size:25px;font-weight:700}.t{font-family:Inter,Arial,sans-serif;fill:#31324a;font-size:16px;font-weight:650}.s{font-family:Inter,Arial,sans-serif;fill:#72738b;font-size:14px}.micro{font-family:Inter,Arial,sans-serif;fill:#85869a;font-size:12px;letter-spacing:.08em}.box{fill:#fff;stroke:#dedfee;stroke-width:2}.node{fill:#f7f7fc;stroke:#dedfee;stroke-width:1.5}.blue{fill:#edf5ff;stroke:#cbdcf5;stroke-width:1.5}.purple{fill:#f1efff;stroke:#dbd6ff;stroke-width:1.5}.pink{fill:#fff0f5;stroke:#f2d7e2;stroke-width:1.5}.edge{stroke:#9697b5;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1440" height="610" rx="26" fill="url(#wash)"/>
  <text x="56" y="62" class="micro">GLASSDAY  /  IMPLEMENTATION MAP</text>
  <text x="56" y="104" class="h">One frame system, clear ownership</text>
  <text x="56" y="132" class="s">Follow the arrows from the app shell to each widget. Theme files skin the shared frame; they do not resize it.</text>

  <rect x="54" y="192" width="232" height="104" rx="17" class="box"/>
  <text x="80" y="232" class="t">AppShell</text><text x="80" y="260" class="s">AppShell.tsx</text>
  <rect x="350" y="192" width="250" height="104" rx="17" class="box"/>
  <text x="377" y="232" class="t">DashboardGrid</text><text x="377" y="260" class="s">grid size + 12px card gap</text>
  <rect x="668" y="192" width="270" height="104" rx="17" class="purple"/>
  <text x="695" y="232" class="t">WidgetSlot / Renderer</text><text x="695" y="260" class="s">one live widget instance</text>
  <rect x="1007" y="176" width="376" height="136" rx="20" class="box"/>
  <text x="1035" y="217" class="t">Shared Widget Frame</text><text x="1035" y="246" class="s">GlassCard.tsx + widget-system.css</text><text x="1035" y="274" class="s">Header / title / icon / actions / body</text>
  <path d="M286 244h55M600 244h60M938 244h61" class="edge"/>

  <rect x="350" y="392" width="270" height="128" rx="17" class="blue"/>
  <text x="379" y="432" class="t">Shared tokens</text><text x="379" y="461" class="s">spacing-tokens.css</text><text x="379" y="487" class="s">base.css · typography · radius</text>
  <rect x="708" y="392" width="270" height="128" rx="17" class="pink"/>
  <text x="737" y="432" class="t">Widget body</text><text x="737" y="461" class="s">widgets/[name].css</text><text x="737" y="487" class="s">feature content and behavior</text>
  <rect x="1066" y="392" width="270" height="128" rx="17" class="purple"/>
  <text x="1095" y="432" class="t">Theme surface</text><text x="1095" y="461" class="s">themes/*.css</text><text x="1095" y="487" class="s">color · blur · border · shadow</text>
  <path d="M485 392v-79" class="edge"/>
  <path d="M843 392v-78" class="edge"/>
  <path d="M1201 392v-70" class="edge"/>
  <text x="56" y="574" class="micro">MOBILE REUSES THE FRAME INSTANCE  ·  MOBILE-COMMON.CSS ADAPTS THE SHARED SLOTS  ·  PIXEL/RETRO OVERRIDE CORNER SHAPE ONLY</text>
</svg>
