[package]
name = "app"
version = "0.1.7"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# Official Tauri plugin: restore only the desktop widget's position and size.
# 공식 Tauri 플러그인으로 위젯 창의 위치와 크기만 다시 불러온다.
tauri-plugin-window-state = "=2.4.0"

[target.'cfg(target_os = "windows")'.dependencies]
# Native blur reaches desktop pixels that CSS cannot sample.
# CSS가 읽지 못하는 Windows 바탕화면 픽셀은 네이티브 blur로 흐린다.
window-vibrancy = "0.8.1"
# Clip the native blur to the same rounded outline as the WebView surface.
# WebView 표면뿐 아니라 네이티브 blur도 같은 둥근 외곽으로 자른다.
windows = { version = "0.61.3", features = ["Win32_Graphics_Dwm", "Win32_Graphics_Gdi"] }
