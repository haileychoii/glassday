
# ============================================================
# GLASSDAY — RUST PACKAGE CONFIGURATION
# 파일: src-tauri/Cargo.toml
# ============================================================
#
# 연결 파일:
# - src-tauri/src/lib.rs
# - src-tauri/tauri.conf.json
# - src-tauri/Cargo.lock
# - src/lib/nativeGlassEffect.ts
# ============================================================

# 01. 애플리케이션 기본 정보

[package]
name = "app"
version = "0.1.20"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"


# 02. Rust 라이브러리 빌드 설정

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


# 03. 빌드 전용 의존성

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }


# 04. 공통 라이브러리 및 Tauri 플러그인

[dependencies]

# JSON 데이터 처리
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

# 개발 로그
log = "0.4"
tauri-plugin-log = "2"

# Tauri 핵심 엔진
tauri = { version = "2.11.3", features = [] }

# Google 로그인 및 외부 링크
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"


# 05. Desktop 전용 플러그인
# Glassday 앱의 중복 실행 방지

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }


# 06. Windows Native Window API
# lib.rs에서 실제 Windows 창의 외곽선과 모서리를 제어한다.

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader"
] }
