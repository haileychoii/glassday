<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glassday · laptop-ui 구조</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 20px; background: #fff9fd; color: #29243d; font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif; }
    main { max-width: 1040px; margin: 0 auto; min-width: 0; }
    .eyebrow { color: #635a78; font-size: 12px; letter-spacing: .08em; margin: 0 0 8px; }
    h1 { font-size: 28px; font-weight: 600; line-height: 1.2; margin: 0 0 12px; }
    p { margin: 0; }
    .summary { color: #5b536d; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    .tier { font: 600 14px Pretendard, "Noto Sans KR", system-ui, sans-serif; fill: #514961; }
    .name { font: 600 16px Pretendard, "Noto Sans KR", system-ui, sans-serif; fill: #29243d; }
    .detail { font: 12px Pretendard, "Noto Sans KR", system-ui, sans-serif; fill: #5b536d; }
    .rule { fill: none; stroke: #817992; stroke-width: 1.5; }
    .edge { stroke: #ccbfd5; stroke-width: 1; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">GLASSDAY / LAPTOP-UI</p>
    <h1>화면과 스타일이 연결되는 순서</h1>
    <p class="summary">위쪽은 React 화면 구성, 아래쪽은 index.css의 실제 적용 순서입니다. 테마 선택은 html/body의 data-theme를 바꾸고, CSS가 그 값에 맞는 색과 재질을 적용합니다.</p>
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="laptop-ui-architecture-title laptop-ui-architecture-desc">
        <title id="laptop-ui-architecture-title">Glassday 화면과 CSS 연결 구조</title>
        <desc id="laptop-ui-architecture-desc">main에서 AppShell, DashboardGrid, GlassCard로 화면이 만들어지고 index.css에서 공통 토큰, 테마, 위젯 및 반응형 CSS가 순서대로 적용됩니다.</desc>
        <defs>
          <marker id="flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#817992"/></marker>
          <marker id="accent-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#9b4b83"/></marker>
        </defs>
        <rect width="960" height="600" fill="#fff9fd"/>
        <text class="tier" x="40" y="58">REACT · 화면 생성</text>
        <text class="tier" x="40" y="338">CSS · 스타일 적용 순서</text>
        <line class="edge" x1="40" y1="288" x2="920" y2="288"/>

        <!-- Connections are drawn before nodes. Every branch follows an orthogonal route. -->
        <line class="rule" x1="224" y1="156" x2="264" y2="156" marker-end="url(#flow-arrow)"/>
        <line class="rule" x1="440" y1="156" x2="480" y2="156" marker-end="url(#flow-arrow)"/>
        <line class="rule" x1="656" y1="156" x2="696" y2="156" marker-end="url(#flow-arrow)"/>
        <line class="rule" x1="224" y1="436" x2="264" y2="436" marker-end="url(#flow-arrow)"/>
        <line class="rule" x1="440" y1="436" x2="480" y2="436" marker-end="url(#flow-arrow)"/>
        <line class="rule" x1="656" y1="436" x2="696" y2="436" marker-end="url(#flow-arrow)"/>
        <line class="rule" x1="132" y1="212" x2="132" y2="380" marker-end="url(#flow-arrow)"/>
        <line x1="788" y1="380" x2="788" y2="212" fill="none" stroke="#9b4b83" stroke-width="1.6" marker-end="url(#accent-arrow)"/>

        <rect x="40" y="100" width="184" height="112" rx="8" fill="#fff" stroke="#cfc4d6"/>
        <text class="name" x="56" y="140">main.tsx</text>
        <text class="detail" x="56" y="166">React 진입점</text>
        <text class="detail" x="56" y="184">index.css 로드</text>

        <rect x="264" y="100" width="176" height="112" rx="8" fill="#fff" stroke="#cfc4d6"/>
        <text class="name" x="280" y="140">AppShell</text>
        <text class="detail" x="280" y="166">데스크톱 틀</text>
        <text class="detail" x="280" y="184">탑바 · 사이드바</text>

        <rect x="480" y="100" width="176" height="112" rx="8" fill="#fff" stroke="#cfc4d6"/>
        <text class="name" x="496" y="140">DashboardGrid</text>
        <text class="detail" x="496" y="166">위젯 위치와 크기</text>

        <rect x="696" y="100" width="224" height="112" rx="8" fill="#fff1f8" stroke="#9b4b83"/>
        <text class="name" x="712" y="140">GlassCard · 위젯</text>
        <text class="detail" x="712" y="166">공통 header/body DOM</text>
        <text class="detail" x="712" y="184">각 위젯 콘텐츠</text>

        <rect x="40" y="380" width="184" height="112" rx="8" fill="#fff" stroke="#cfc4d6"/>
        <text class="name" x="56" y="420">index.css</text>
        <text class="detail" x="56" y="450">CSS import 순서 관리</text>

        <rect x="264" y="380" width="176" height="112" rx="8" fill="#fff" stroke="#cfc4d6"/>
        <text class="name" x="280" y="420">토큰 · 공통 틀</text>
        <text class="detail" x="280" y="450">spacing · base · layout</text>

        <rect x="480" y="380" width="176" height="112" rx="8" fill="#fff" stroke="#cfc4d6"/>
        <text class="name" x="496" y="420">테마 · 위젯 CSS</text>
        <text class="detail" x="496" y="450">색 · 재질 · 내부 내용</text>

        <rect x="696" y="380" width="224" height="112" rx="8" fill="#fff" stroke="#cfc4d6"/>
        <text class="name" x="712" y="420">최종 보정</text>
        <text class="detail" x="712" y="450">responsive · mobile</text>
        <text class="detail" x="712" y="468">widget-system · motion</text>

        <text class="detail" x="40" y="552">테마: Pastel / Glass Light / Glass Dark / Aurora / Mac Core / Pixel Desk / Retro(Pink Diary)</text>
      </svg>
    </div>
  </main>
</body>
</html>
